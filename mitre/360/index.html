[hidden] { display: none !important; }
/* Visor inmersivo a pantalla completa: la imagen manda, la interfaz flota en carbón translúcido en los bordes. */
:root {
  --carbon: #22211E; --hormigon: #DAD9DE; --negro: #0F0F0E; --blanco: #FFFFFF;
  --velo: rgba(34, 33, 30, .72); --velo-fuerte: rgba(24, 23, 21, .92); --linea: rgba(218, 217, 222, .22);
  --aviso: #E3B25A; --critico: #E8735C; --bien: #A9C3A1;
  --f: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; background: var(--negro); color: var(--blanco); }
body { font-family: var(--f); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; background: var(--negro); }
#pano { position: absolute; inset: 0; }
.psv-container { background: var(--negro) !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hormigon); outline-offset: 2px; }

/* encabezado */
.top { position: absolute; z-index: 20; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, rgba(15,15,14,.66), rgba(15,15,14,0)); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; pointer-events: auto; }
.brand img { width: 42px; height: auto; flex: none; }
.brand .txt { min-width: 0; border-left: 1px solid var(--linea); padding-left: 14px; }
.obra { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--hormigon); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.waves { display: block; width: 150px; height: 14px; margin-top: 6px; opacity: .55; }

/* botones laterales */
.side { position: absolute; z-index: 20; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 84px); display: flex; flex-direction: column; gap: 8px; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--linea); background: var(--velo); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; transition: background .2s, border-color .2s; }
.ib svg { width: 20px; height: 20px; fill: none; stroke: var(--blanco); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ib[aria-pressed="true"] { background: var(--hormigon); border-color: var(--hormigon); }
.ib[aria-pressed="true"] svg { stroke: var(--carbon); }
.ib:hover { border-color: var(--hormigon); }

/* minimapa */
#map { --map-o: .62; position: absolute; z-index: 15; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  background: rgba(24, 23, 21, calc(var(--map-o) * .9)); border: 1px solid var(--linea); border-radius: 10px; padding: 8px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: width .25s ease, height .25s ease; }

#mapSvg { display: block; width: 100%; height: auto; cursor: pointer; overflow: visible; }
#mapSvg image { opacity: calc(.35 + var(--map-o) * .65); }
#mapSvg .room { fill: var(--hormigon); font-family: var(--f); font-size: 21px; font-weight: 500; letter-spacing: .06em; text-anchor: middle; dominant-baseline: middle; opacity: .7; pointer-events: none; text-transform: uppercase; }
#map:not([data-big="1"]) #mapSvg .room { display: none; }
#mapSvg .cone { fill: rgba(255,255,255,.26); stroke: rgba(255,255,255,.65); stroke-width: 2; pointer-events: none; }

#mapSvg .pt:hover .dot, #mapSvg .pt:focus-visible .dot { stroke: var(--blanco); }
.maptools { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--hormigon); }
.maptools button { border: 0; background: none; padding: 4px 0; cursor: pointer; letter-spacing: .08em; text-transform: uppercase; font-size: 10px; font-weight: 600; }
.maptools input { flex: 1; min-width: 0; accent-color: var(--hormigon); }
#map:not([data-big="1"]) .maptools input, #map:not([data-big="1"]) .maptools label { display: none; }

/* ambientes */
#chips { position: absolute; z-index: 16; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, rgba(15,15,14,.7), rgba(15,15,14,0)); justify-content: safe center; }
#chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 5px; border-radius: 999px; border: 1px solid var(--linea); background: var(--velo); cursor: pointer; font-size: 13px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.chip img { width: 56px; height: 28px; object-fit: cover; border-radius: 999px; }
.chip em { font-style: normal; font-size: 10px; color: var(--hormigon); margin-right: 6px; font-variant-numeric: tabular-nums; }
.chip[aria-current="true"] { background: var(--hormigon); color: var(--carbon); border-color: var(--hormigon); }
.chip[aria-current="true"] em { color: var(--carbon); }

/* flechas de paso y puntos de interés */
.go { border: 0; background: none; padding: 0; color: inherit; width: 110px; height: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.go .ring { width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(255,255,255,.95); background: rgba(34,33,30,.35); box-shadow: 0 0 0 6px rgba(255,255,255,.12), 0 6px 18px rgba(0,0,0,.35); transform: perspective(160px) rotateX(55deg); transition: transform .2s, background .2s; }
.go:hover .ring { background: rgba(255,255,255,.35); transform: perspective(160px) rotateX(48deg) scale(1.08); }
.go .lbl { font-family: var(--f); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--blanco); background: var(--velo); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.poi { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; padding: 0; }
.poi span { width: 18px; height: 18px; border-radius: 50%; background: var(--blanco); box-shadow: 0 0 0 5px rgba(255,255,255,.28), 0 2px 10px rgba(0,0,0,.4); animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(255,255,255,.08), 0 2px 10px rgba(0,0,0,.4); } }
.psv-tooltip { background: var(--velo-fuerte) !important; border-radius: 8px !important; font-family: var(--f) !important; }
.psv-tooltip-content b { display: block; font-weight: 600; font-size: 13px; }
.psv-tooltip-content small { font-size: 11px; color: var(--hormigon); }

/* ficha */
#sheet { position: absolute; z-index: 30; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 84px); width: min(380px, calc(100vw - 88px)); max-height: calc(100% - 200px); overflow: auto;
  background: var(--velo-fuerte); border: 1px solid var(--linea); border-radius: 12px; padding: 18px 18px 16px; margin-right: 56px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#sheetClose { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--linea); background: none; cursor: pointer; font-size: 18px; line-height: 1; }
.eyebrow { margin: 0; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--hormigon); }
.code { font-variant-numeric: tabular-nums; letter-spacing: .06em; }
#sheet h2 { margin: 6px 40px 14px 0; font-weight: 400; font-size: 22px; text-wrap: balance; }
.spec { margin: 0; display: grid; gap: 0; }
.spec .row { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--linea); }
.spec dt { font-size: 11px; color: var(--hormigon); letter-spacing: .04em; }
.spec dd { margin: 0; font-size: 13px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.pill { font-size: 9px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid; }
.pill.ok { color: var(--bien); border-color: currentColor; }
.pill.warn { color: var(--aviso); border-color: currentColor; }
.pill.todo { color: var(--hormigon); border-style: dashed; opacity: .8; }
.src { margin: 12px 0 0; font-size: 11px; line-height: 1.5; color: var(--hormigon); opacity: .8; }

/* editor */
#btnEdit[hidden] { display: none; }
#editor { position: absolute; z-index: 25; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 84px); width: min(560px, calc(100vw - 96px));

#btnSave { background: var(--hormigon) !important; color: var(--carbon); border-color: var(--hormigon) !important; font-weight: 600; }

#hint { margin: 0; font-size: 12px; color: var(--hormigon); }
#hint[data-warn="1"] { color: var(--critico); }

#qc li[data-s="warn"]::before { background: var(--aviso); }
#qc li[data-s="crit"]::before { background: var(--critico); }
#poiForm { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--linea); padding-top: 10px; }
#poiForm label { display: grid; gap: 4px; font-size: 11px; color: var(--hormigon); min-width: 0; }
#poiForm .full { grid-column: 1 / -1; }
#poiForm input, #poiForm select { font: inherit; font-size: 13px; color: var(--blanco); background: rgba(255,255,255,.06); border: 1px solid var(--linea); border-radius: 6px; padding: 7px 8px; min-width: 0; }
#poiForm .acts { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
#poiForm .acts button { border: 1px solid var(--linea); background: none; border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 12px; }
#poiForm .acts button[type="submit"] { background: var(--hormigon); color: var(--carbon); font-weight: 600; }
#app[data-edit="1"] #pano { cursor: crosshair; }

#sheet .grp { margin: 16px 0 2px; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--hormigon); opacity: .75; }
#sheet a { color: var(--blanco); }
#toast { position: absolute; z-index: 45; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); margin: 0; max-width: calc(100vw - 32px); background: var(--velo-fuerte); border: 1px solid var(--linea); border-radius: 999px; padding: 9px 16px; font-size: 13px; }

#loader { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--negro); }
#loader div { display: grid; justify-items: center; gap: 16px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--hormigon); }

@keyframes breathe { 50% { opacity: .45; } }

@media (max-width: 640px) {

  .brand img { width: 34px; }
  #sheet { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); width: auto; margin: 0; max-height: 55%; }
  #editor { left: max(12px, env(safe-area-inset-left, 0px)); right: 64px; transform: none; width: auto; }
  .chip { font-size: 12px; } .chip img { width: 44px; height: 22px; }
  #chips { justify-content: flex-start; }
}
/* celular apaisado y pantallas bajas: todo más compacto para que convivan imagen, plano y controles */
@media (max-height: 520px) {

  #roomName { font-size: 17px; }
  .side { top: calc(env(safe-area-inset-top, 0px) + 8px); right: max(10px, env(safe-area-inset-right, 0px)); flex-direction: row; }
  .ib { width: 38px; height: 38px; }
  #map { bottom: calc(env(safe-area-inset-bottom, 0px) + 54px); padding: 6px; }
  #map[data-orient="h"] { width: min(30vw, 220px); }
  #map[data-big="1"][data-orient="h"] { width: min(70vw, 560px); }
  #chips { padding-top: 8px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .chip { padding: 6px 12px; font-size: 12px; }
  .chip img { display: none; }
  #sheet { top: calc(env(safe-area-inset-top, 0px) + 54px); bottom: auto; max-height: calc(100% - 120px); margin-right: 0; right: max(10px, env(safe-area-inset-right, 0px)); left: auto; width: min(380px, 60vw); }
  #editor { top: calc(env(safe-area-inset-top, 0px) + 54px); max-height: calc(100% - 120px); overflow: auto; }
  .maptools { margin-top: 4px; }
}
@media (max-width: 640px) and (min-height: 521px) {

}
@media (max-width: 640px), (max-height: 520px) {
  #app:has(#sheet:not([hidden])) #map, #app:has(#sheet:not([hidden])) #chips { visibility: hidden; }
}
@media (prefers-reduced-motion: reduce) { .poi span, #loader img { animation: none; } #map { transition: none; } }
