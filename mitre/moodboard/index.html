:root {
  --bg: #191816; --side: #1F1E1B; --card: #22211E; --card2: #2A2925; --line: rgba(218, 217, 222, .11); --line2: rgba(218, 217, 222, .2);

  --f: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--f); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }

.waves { position: fixed; inset: auto 0 0 0; height: 60vh; pointer-events: none; opacity: .22; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brandline { margin: 0; font-size: 11px; letter-spacing: .14em; color: var(--dim); }
.brandline b { color: var(--text); font-weight: 700; }
.crumb { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; border: 1px solid var(--line2); border-radius: 4px; padding: 5px 10px; color: var(--text); text-decoration: none; }
.head { display: flex; align-items: center; gap: 14px; margin: 18px 0 4px; }
.head .crumb { margin-left: auto; }
.head .bar { width: 8px; align-self: stretch; min-height: 34px; border-radius: 2px; background: var(--orange); }
h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); font-weight: 700; text-wrap: balance; }
.sub { margin: 0 0 18px 22px; color: var(--dim); font-size: 12px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); cursor: pointer; font-weight: 600; font-size: 13px; }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--dim)); }
.tab[aria-selected="true"] { background: var(--c); border-color: var(--c); color: #191816; }
.tab[aria-selected="true"] .dot { background: #191816; }
.badge { font-size: 10px; font-weight: 700; background: var(--card2); border-radius: 999px; padding: 1px 6px; color: var(--text); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .badge { background: rgba(0,0,0,.18); color: #191816; }
.badge.warn { background: var(--red); color: #fff; }

.sec { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--c, var(--purple)); }
.sec::before { content: ''; width: 9px; height: 9px; background: currentColor; border-radius: 1px; }
.sec::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.sec .n { color: var(--mute); letter-spacing: .06em; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-top: 2px solid var(--green); border-radius: 4px; overflow: hidden; }
.stat { background: var(--card); padding: 14px 16px; min-width: 0; }
.stat .k { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }
.stat .v small { font-size: 12px; font-weight: 500; color: var(--dim); }
.prog { height: 4px; background: var(--card2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--green); width: 0; transition: width .4s; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; }
.chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; cursor: pointer; font-size: 12px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--hormigon); color: #191816; border-color: var(--hormigon); font-weight: 600; }
.search { margin-left: auto; min-width: 0; flex: 0 1 260px; background: var(--card); border: 1px solid var(--line2); border-radius: 6px; padding: 7px 11px; }

/* moodboard */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-top: 2px solid var(--c, var(--orange)); border-radius: 4px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; transition: border-color .2s, transform .2s; }
.tile:hover { border-color: var(--line2); transform: translateY(-2px); }
.tile .ph { aspect-ratio: 4 / 3; width: 100%; max-width: 100%; background: var(--card2); position: relative; }
.tile .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .ph .noimg { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; color: var(--mute); background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(218,217,222,.035) 10px 11px); }
.tile .ph .noimg b { font-size: 22px; color: var(--dim); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.tile .ph .noimg small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.25); vertical-align: -2px; }
.tile .bd { padding: 11px 12px 12px; display: grid; gap: 4px; }
.tile .nm { font-weight: 600; font-size: 13px; }
.tile .meta { font-size: 11px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.code { font-variant-numeric: tabular-nums; letter-spacing: .04em; color: var(--dim); font-size: 11px; }

/* especificaciones */
.list { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--card); }
.row { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, .8fr) minmax(0, 1.4fr) minmax(0, 1fr) 28px; gap: 14px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--card2); }
.row .t { min-width: 0; display: flex; gap: 10px; align-items: center; }
.row .t img, .row .t .sq { width: 38px; height: 38px; border-radius: 3px; object-fit: cover; flex: none; background: var(--card2); }
.row .t b { display: block; font-weight: 600; font-size: 13px; }
.qty { font-variant-numeric: tabular-nums; font-weight: 600; }
.qty.none { color: var(--amber); font-weight: 500; font-size: 12px; }
.amb { font-size: 12px; color: var(--dim); min-width: 0; overflow-wrap: anywhere; }
.st { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid; justify-self: start; white-space: nowrap; }
.st.ok { color: var(--green); } .st.prop { color: var(--blue); } .st.todo { color: var(--mute); border-style: dashed; } .st.alert { color: var(--amber); }
.chev { color: var(--mute); }

/* panel de ítem */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
#panel { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--side); border-left: 1px solid var(--line2); overflow: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) 20px; }

<script>
(() => {
const D = JSON.parse(document.getElementById('cat-data').textContent);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const nf = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 2 });
const GC = { 'Pisos y revestimientos': 'var(--orange)', 'Pinturas y revoques': 'var(--purple)', 'Cielorrasos': 'var(--blue)', 'Aberturas': 'var(--green)',
  'Sanitarios y grifería': 'var(--blue)', 'Electrodomésticos': 'var(--amber)', 'Iluminación': 'var(--amber)', 'Carpintería y equipamiento': 'var(--orange)',
  'Maderas y estructura vista': 'var(--orange)', 'Exterior y patio': 'var(--green)', 'Obra gruesa': 'var(--dim)' };
const ORDER = Object.keys(GC);
const AMB = ['Cocina/Lavadero', 'Sala de Estar', 'Hall Acceso', 'Dormitorio', 'Baño', 'Patio Interno'];
const items = D.items.map((i) => ({ ...i, full: i.item, item: i.item.split(' (')[0] }));
let verif = JSON.parse(JSON.stringify(D.verif || {}));      // id -> { campos: {k: {s, v, nota}}, buscar, compra: {proveedor, precio, fecha} }
let db = null, canEdit = false;
let tab = 'mood', amb = 'Todos', q = '', showGruesa = false;

/* ondas decorativas */
(() => { let s = ''; for (let i = 0; i < 26; i++) { const o = i * 9; s += `<path d="M-20 ${420 + o} C 260 ${180 + o * 1.6}, 520 ${620 - o}, 820 ${330 + o * .7} S 1150 ${120 + o}, 1240 ${260 + o * .8}"/>`; } $('#wv').innerHTML = s; })();

$('#obra').textContent = D.obra;
if (D.recorrido && !window.claude) $('#toTour').hidden = false;
$('#sub').textContent = `Moodboard y especificaciones · cantidades del cómputo del modelo Revit (${D.fecha}) · muestras recortadas de los renders`;

const fieldsOf = (it) => (D.prop[it.id] || []);
function stateOf(it) {
  const f = fieldsOf(it), v = verif[it.id]?.campos || {};
  const tot = f.length, ok = f.filter((x) => v[x.k]?.s === 'ok' || v[x.k]?.s === 'fix').length;
  if (it.alerta && !ok) return ['alert', 'Revisar'];
  if (!tot) return ['todo', 'Sin propuesta'];
  if (ok === tot) return ['ok', 'Verificado'];
  return ok ? ['prop', `${ok} de ${tot}`] : ['prop', 'Propuesta'];
}
const visible = () => items.filter((it) => (showGruesa || it.grupo !== 'Obra gruesa')
  && (amb === 'Todos' || it.ambientes.includes(amb))
  && (!q || (it.item + ' ' + it.codigo + ' ' + (fieldsOf(it).map((f) => f.v).join(' '))).toLowerCase().includes(q)));
const groups = (list, img) => ORDER.map((g) => [g, list.filter((i) => i.grupo === g).sort((a, b) => img ? (!!b.muestra - !!a.muestra) : 0)]).filter(([, l]) => l.length);
const qty = (it) => it.cantidad == null ? '<span class="qty none">sin cantidad</span>' : `<span class="qty">${nf.format(it.cantidad)} ${esc(it.unidad)}</span>`;
const colorDe = (it) => it.colorModelo?.[0]?.hex || it.muestra?.hex;
const swatch = (it) => colorDe(it) ? `<span class="sw" style="background:${colorDe(it)}" title="${it.colorModelo ? 'Color del modelo' : 'Color medido en el render'}"></span>` : '';

function stats() {
  const real = items.filter((i) => i.grupo !== 'Obra gruesa');
  $('#s-items').innerHTML = `${real.length} <small>+ ${items.length - real.length} de obra gruesa</small>`;
  $('#s-qty').innerHTML = `${items.filter((i) => i.cantidad != null).length} <small>de ${items.length}</small>`;
  let tot = 0, ok = 0;
  for (const it of items) { const f = fieldsOf(it); tot += f.length; const v = verif[it.id]?.campos || {}; ok += f.filter((x) => ['ok', 'fix'].includes(v[x.k]?.s)).length; }
  $('#s-ver').innerHTML = `${ok} <small>de ${tot}</small>`; $('#s-prog').style.width = tot ? (ok / tot * 100) + '%' : 0;
  $('#s-ask').innerHTML = `${Object.values(verif).filter((v) => v.buscar).length} <small>ítems para investigar</small>`;
  $('#b-spec').textContent = real.length; $('#b-alert').textContent = items.filter((i) => i.alerta).length + D.alertas.length;
}

function filters() {
  $('#filters').innerHTML = ['Todos', ...AMB].map((a) => `<button class="chip" data-amb="${esc(a)}" aria-pressed="${a === amb}">${esc(a.replace('/', ' / '))}</button>`).join('')
    + `<button class="chip" id="gruesa" aria-pressed="${showGruesa}">Obra gruesa</button><input class="search" id="q" type="search" placeholder="Buscar material, código o marca" value="${esc(q)}" aria-label="Buscar">`;
}
$('#filters').addEventListener('click', (e) => {
  const c = e.target.closest('[data-amb]'); if (c) { amb = c.dataset.amb; render(); }
  if (e.target.id === 'gruesa') { showGruesa = !showGruesa; render(); }
});
$('#filters').addEventListener('input', (e) => { if (e.target.id === 'q') { q = e.target.value.trim().toLowerCase(); renderView(); } });

function renderView() {
  const list = visible();
  let h = '';
  if (tab === 'mood') {
    for (const [g, l] of groups(list, true)) {
      h += `<h2 class="sec" style="--c:${GC[g]}">${esc(g)} <span class="n">${l.length}</span></h2><div class="grid">`;
      for (const it of l) {
        const prop = fieldsOf(it).find((f) => f.v && /Tipo|Material|Frentes|Terminación|Marca/.test(f.k));
        h += `<button class="tile" data-id="${esc(it.id)}" style="--c:${GC[g]}"><div class="ph">${it.muestra ? `<img src="${it.muestra.img}" alt="" loading="lazy">` : `<span class="noimg"><b>${esc(it.codigo)}</b><small>Sin muestra en el render</small></span>`}</div>
          <div class="bd"><span class="nm">${esc(it.item)}</span><span class="meta">${swatch(it)}${colorDe(it) ? esc(colorDe(it)) : ''}<span class="code">${esc(it.codigo)}</span>${qty(it)}</span>
          ${prop ? `<span class="meta">${esc(prop.v)}</span>` : ''}</div></button>`;
      }
      h += '</div>';
    }
  } else if (tab === 'spec') {
    h += `<div class="legend"><span><span class="st ok">Verificado</span> todos los campos confirmados</span><span><span class="st prop">Propuesta</span> datos de Claude por revisar</span><span><span class="st alert">Revisar</span> el modelo tiene un problema</span><span><span class="st todo">Sin propuesta</span> falta investigar</span></div>`;
    for (const [g, l] of groups(list)) {
      h += `<h2 class="sec" style="--c:${GC[g]}">${esc(g)} <span class="n">${l.length}</span></h2><div class="list">`;
      for (const it of l) {
        const [c, t] = stateOf(it);
        h += `<button class="row" data-id="${esc(it.id)}"><span class="t">${it.muestra ? `<img src="${it.muestra.img}" alt="">` : '<span class="sq"></span>'}<span><b>${esc(it.item)}</b><span class="code">${esc(it.codigo)}</span></span></span>
          ${qty(it)}<span class="amb">${esc(it.ambientes.join(' · ') || '—')}</span><span class="st ${c}">${esc(t)}</span><span class="chev">›</span></button>`;
      }
      h += '</div>';
    }
  } else {
    h += `<h2 class="sec" style="--c:var(--amber)">Para corregir en el modelo <span class="n">${D.alertas.length + items.filter((i) => i.alerta).length}</span></h2><div class="alerts">`;
    for (const it of items.filter((i) => i.alerta)) h += `<button class="al" data-id="${esc(it.id)}"><b>${esc(it.item)} · ${esc(it.codigo)}</b><span>${esc(it.alerta)}</span></button>`;
    for (const a of D.alertas) h += `<div class="al"><b>${esc(a[0])}</b><span>${esc(a[1])}</span></div>`;
    h += '</div>';
  }
  if (!list.length && tab !== 'alert') h = '<p class="sub" style="margin:24px 0">No hay ítems con ese filtro.</p>';
  $('#view').innerHTML = h;
}
$('#view').addEventListener('click', (e) => { const t = e.target.closest('[data-id]'); if (t) openItem(t.dataset.id); });

function render() { filters(); renderView(); stats();
  for (const [id, t] of [['t-mood', 'mood'], ['t-spec', 'spec'], ['t-alert', 'alert']]) $('#' + id).setAttribute('aria-selected', String(tab === t)); }
for (const [id, t] of [['t-mood', 'mood'], ['t-spec', 'spec'], ['t-alert', 'alert']]) $('#' + id).addEventListener('click', () => { tab = t; render(); });

/* ---------- panel de ítem con verificación por campo ---------- */
let open = null;
function openItem(id) {
  const it = items.find((i) => i.id === id); if (!it) return;
  open = id;
  const v = verif[id] || { campos: {}, compra: {} };
  const m = it.muestra;
  const comp = v.compra || {};
  $('#pBody').innerHTML = `
    <p class="eyebrow" style="--c:${GC[it.grupo]}">${esc(it.grupo)} · <span class="code">${esc(it.codigo)}</span></p>
    <h2 id="pTitle">${esc(it.item)}</h2>
    <div class="hero ${m ? '' : 'solo'}">${m ? `<img src="${m.img}" alt="Muestra del render">` : ''}
      <div class="facts">
        <div><span>Cantidad</span><span>${it.cantidad == null ? 'sin cantidad en el modelo' : nf.format(it.cantidad) + ' ' + esc(it.unidad)}</span></div>
        ${it.medidas ? `<div><span>Medidas</span><span>${esc(it.medidas)}</span></div>` : ''}
        <div><span>Ambientes</span><span>${esc(it.ambientes.join(', ') || '—')}</span></div>
        ${it.elementos.length ? `<div><span>En Revit</span><span>${esc(it.elementos.join(' · '))}</span></div>` : ''}
        ${it.full !== it.item ? `<div><span>Ítem del cómputo</span><span>${esc(it.full)}</span></div>` : ''}
        ${it.fuenteCantidad ? `<div><span>Fuente</span><span>${esc(it.fuenteCantidad)}</span></div>` : ''}
        ${m ? `<div><span>Color medido</span><span><span class="sw" style="background:${m.hex}"></span> ${m.hex}</span></div>` : ''}
      </div></div>
    ${it.colorModelo ? `<h2 class="sec" style="--c:var(--green)">Color real del material (Revit, sin luz)</h2>${it.colorModelo.map((c) => `<div class="fsrc" style="font-size:12px;color:var(--text)"><span class="sw" style="background:${c.hex}"></span> ${esc(c.material)} · ${c.hex} · color de ${esc(c.fuente.toLowerCase())}${c.textura ? ' · textura ' + esc(c.textura) : ''}</div><div class="ralrow">${c.ral.map((r) => `<span class="ral"><span class="sw" style="background:${r.hex}"></span>${esc(r.ral)} · ${esc(r.nombre)} · ΔE ${String(r.dE).replace('.', ',')}</span>`).join('')}</div>`).join('')}` : (it.materiales?.length ? `<div class="fsrc">Materiales en Revit: ${esc(it.materiales.join(' · '))}. Falta exportar su color (R29).</div>` : '')}
    ${m ? `<div class="fsrc">Muestra: ${esc(m.de)}. Color afectado por la luz del render.</div><div class="ralrow">${m.ral.map((r) => `<span class="ral"><span class="sw" style="background:${r.hex}"></span>${esc(r.ral)} · ${esc(r.nombre)} · ΔE ${String(r.dE).replace('.', ',')}</span>`).join('')}</div>` : ''}
    ${it.alerta ? `<div class="alertbox">${esc(it.alerta)}</div>` : ''}
    <h2 class="sec" style="--c:var(--purple)">Especificación propuesta</h2>
    <div id="fields">${fieldsOf(it).map((f) => fieldHtml(f, v.campos[f.k])).join('') || '<p class="sub" style="margin:0">Todavía no hay propuesta para este ítem.</p>'}</div>
    <h2 class="sec" style="--c:var(--green)">Compra</h2>
    <div class="edit">
      <input id="cProv" placeholder="Proveedor" value="${esc(comp.proveedor || '')}" ${canEdit ? '' : 'disabled'}>
      <input id="cPrecio" placeholder="Precio de referencia (con unidad y moneda)" value="${esc(comp.precio || '')}" ${canEdit ? '' : 'disabled'}>
      <input id="cFecha" placeholder="Fecha del precio" value="${esc(comp.fecha || '')}" ${canEdit ? '' : 'disabled'}>
    </div>
    <label class="ask"><input type="checkbox" id="askC" ${v.buscar ? 'checked' : ''}> Pedirle a Claude que busque productos reales con ficha técnica y precio para este ítem</label>
    <div class="facts-acts"><button class="b main" id="saveIt" type="button">Guardar</button></div>
    <p class="saveline" id="saveline">${canEdit ? (db ? '' : 'Guardado no disponible en esta vista.') : 'Vista de solo lectura.'}</p>`;
  $('#panel').classList.toggle('ro', !canEdit);
  $('#panel').hidden = false; $('#scrim').hidden = false; $('#pClose').focus();
}
function fieldHtml(f, st = {}) {
  const val = st.s === 'fix' ? st.v : f.v;
  return `<div class="field" data-k="${esc(f.k)}" data-s="${st.s || ''}">
    <div class="fk"><span>${esc(f.k)}</span>${st.s === 'ok' ? '<span class="st ok">Correcto</span>' : st.s === 'fix' ? '<span class="st prop">Corregido</span>' : st.s === 'no' ? '<span class="st alert">No viable</span>' : f.v ? '<span class="st prop">Propuesta</span>' : '<span class="st todo">A completar</span>'}</div>
    <div class="fv ${val ? '' : 'empty'}">${esc(val || 'a completar')}</div>
    ${f.fuente ? `<div class="fsrc">Fuente: ${esc(f.fuente)}</div>` : ''}
    ${st.nota ? `<div class="fsrc">Nota: ${esc(st.nota)}</div>` : ''}
    <div class="facts-acts">
      ${f.v ? `<button type="button" class="b ok" data-a="ok" aria-pressed="${st.s === 'ok'}">✓ Correcto</button>` : ''}
      <button type="button" class="b fix" data-a="fix" aria-pressed="${st.s === 'fix'}">✎ ${f.v ? 'Corregir' : 'Cargar'}</button>
      ${f.v ? `<button type="button" class="b no" data-a="no" aria-pressed="${st.s === 'no'}">✗ No viable</button>` : ''}
    </div>
    <div class="edit" hidden><input placeholder="${f.v ? 'Valor correcto' : 'Valor'}" value="${esc(st.s === 'fix' ? st.v : '')}"><textarea rows="2" placeholder="Nota (opcional): por qué no sirve, qué buscar">${esc(st.nota || '')}</textarea></div>
  </div>`;
}
$('#pBody').addEventListener('click', (e) => {
  const b = e.target.closest('.b[data-a]'); if (!b || !canEdit) return;
  const fd = b.closest('.field'), a = b.dataset.a, cur = fd.dataset.s;
  const next = cur === a ? '' : a;
  fd.dataset.s = next;
  fd.querySelectorAll('.b[data-a]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.a === next)));
  fd.querySelector('.edit').hidden = !(next === 'fix' || next === 'no');
  if (next === 'fix' || next === 'no') fd.querySelector('.edit input, .edit textarea').focus();
  $('#saveline').textContent = 'Hay cambios sin guardar.';
});
$('#pBody').addEventListener('input', () => { $('#saveline').textContent = 'Hay cambios sin guardar.'; });
$('#pBody').addEventListener('click', async (e) => {
  if (e.target.id !== 'saveIt' || !open) return;
  const it = items.find((i) => i.id === open);
  const campos = {};
  document.querySelectorAll('#fields .field').forEach((fd) => {
    const s = fd.dataset.s; if (!s) return;
    const [inp, ta] = fd.querySelectorAll('.edit input, .edit textarea');
    campos[fd.dataset.k] = { s, v: s === 'fix' ? inp.value.trim() : '', nota: ta.value.trim() };
  });
  const rec = { campos, buscar: $('#askC').checked, compra: { proveedor: $('#cProv').value.trim(), precio: $('#cPrecio').value.trim(), fecha: $('#cFecha').value.trim() } };
  verif[open] = rec; stats(); renderView();
  if (!db) { $('#saveline').textContent = 'Cambios aplicados solo en esta vista (guardado no disponible).'; return; }
  $('#saveline').textContent = 'Guardando…';
  try {
    await db.doc('verificacion/' + open).set({ item: it.item, codigo: it.codigo, campos: JSON.stringify(campos), buscar: rec.buscar, compra: JSON.stringify(rec.compra), actualizado: new Date().toISOString() });
    $('#saveline').textContent = 'Guardado. Claude lo lee en la próxima sesión.';
  } catch (err) { $('#saveline').textContent = `No se pudo guardar (${err?.code || 'error'}). Probá de nuevo.`; }
});
function closePanel() { $('#panel').hidden = true; $('#scrim').hidden = true; open = null; }
$('#pClose').addEventListener('click', closePanel); $('#scrim').addEventListener('click', closePanel);
addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

window.ritualMood = { edit: (v) => { canEdit = v; } };
render();
(async () => {
  const c = window.claude; if (!c?.use) return;
  const [dbNs, user] = await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null)]);
  canEdit = user ? await user.canEdit().catch(() => false) : false;
  db = canEdit ? dbNs : dbNs;
  if (!dbNs) return;
  try {
    const snap = await dbNs.collection('verificacion').get();
    for (const d of snap.docs) { const x = d.data(); verif[d.id] = { campos: JSON.parse(x.campos || '{}'), buscar: !!x.buscar, compra: JSON.parse(x.compra || '{}') }; }
    render();
  } catch { /* sin verificaciones guardadas */ }
})();
})();
</script>

</body></html>
